
name: DSHIOS Build Environment Check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: System information
        run: |
          uname -m
          sw_vers
          xcodebuild -version
          xcode-select -p

      - name: Check build tools
        run: |
          for tool in brew node npm meson ninja lld; do
            echo "Checking $tool"
            command -v "$tool" || true
          done

      - name: Check Xcode project
        run: |
          xcodebuild -list -project DSH.xcodeproj
