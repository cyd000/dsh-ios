
name: DSHIOS Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check environment
        run: |
          uname -m
          xcodebuild -version
          node --version

      - name: Install dependencies
        run: |
          brew install meson ninja lld libarchive pkg-config
          gem install xcodeproj --user-install
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
          echo "PKG_CONFIG_PATH=$(brew --prefix libarchive)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Build emulator
        run: |
          make emulator

      - name: Configure emulator tools
        run: |
          meson configure ish-arm64/build-arm64-release
          meson setup ish-arm64/build-arm64-release \
            --reconfigure \
            -Dguest_arch=arm64 \
            --buildtype=release
          ninja -C ish-arm64/build-arm64-release
          ls -lah ish-arm64/build-arm64-release/tools

      - name: Diagnose fakefsify
        run: |
          echo "=== Search fakefsify files ==="
          find . -iname '*fakefsify*' -print

          echo "=== Built tools ==="
          ls -lah ish-arm64/build-arm64-release/tools || true

          echo "=== Build definitions ==="
          grep -R -n 'fakefsify' \
            Makefile ish-arm64/meson.build \
            ish-arm64/meson_options.txt \
            ish-arm64/tools scripts 2>/dev/null || true

      - name: Build Linux rootfs
        run: |
          test -x ish-arm64/build-arm64-release/tools/fakefsify
          test -x ish-arm64/build-arm64-release/tools/unfakefsify
          make rootfs

      - name: Upload rootfs artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-rootfs
          path: build/root.tar.gz
          if-no-files-found: error
          retention-days: 3
