
name: DSHIOS Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check environment
        run: |
          uname -m
          xcodebuild -version
          node --version

      - name: Install dependencies
        run: |
          brew install meson ninja lld
          gem install xcodeproj --user-install
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"

      - name: Build emulator
        run: |
          make emulator

    
      - name: Diagnose fakefsify
        run: |
          echo "=== Search fakefsify files ==="
          find . -iname '*fakefsify*' -print

          echo "=== Built tools ==="
          ls -lah ish-arm64/build-arm64-release/tools || true

          echo "=== Build script ==="
          sed -n '1,220p' scripts/build-rootfs.sh

          echo "=== Build definitions ==="
          grep -R -n 'fakefsify' \
            Makefile ish-arm64/meson.build \
            ish-arm64/meson_options.txt \
            ish-arm64/tools scripts 2>/dev/null || true

      - name: Build Linux rootfs
        run: |
          make rootfs


      - name: Upload rootfs artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-rootfs
          path: build/root.tar.gz
          if-no-files-found: error
          retention-days: 3
