
name: DSHIOS Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check environment
        run: |
          uname -m
          xcodebuild -version
          node --version

      - name: Install dependencies
        run: |
          brew install meson ninja lld libarchive pkg-config
          gem install xcodeproj --user-install
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
          echo "PKG_CONFIG_PATH=$(brew --prefix libarchive)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Verify libarchive
        run: |
          pkg-config --modversion libarchive
          pkg-config --cflags --libs libarchive

      - name: Build emulator
        run: |
          make emulator

      - name: Verify fakefsify
        run: |
          echo "=== Built tools ==="
          ls -lah ish-arm64/build-arm64-release/tools

          echo "=== Check fakefsify ==="
          test -x ish-arm64/build-arm64-release/tools/fakefsify

          echo "=== Check unfakefsify ==="
          test -x ish-arm64/build-arm64-release/tools/unfakefsify

          echo "=== All required tools exist ==="

      - name: Build Linux rootfs
        run: |
          make rootfs

      - name: Upload rootfs artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-rootfs
          path: build/root.tar.gz
          if-no-files-found: error
          retention-days: 3

